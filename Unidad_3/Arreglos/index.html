<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Ejercicios</title>
</head>
<body>
    <header class="container-fluid p-5 bg-success text-black text-center">
        <h1>Ejercicios de Arreglos</h1>
    </header>
    <article class="col-sm-4">
        <h3>Temperaturas</h3>        
        <button class="btn btn-outline-danger" onclick="cargar()">Captura 7 temperaturas</button>
        <button class="btn btn-outline-success" onclick="mostrar()">Mostrar</button>
    </article>
    <article id="min"></article>
    <article id="max"></article>
    <article id="prom"></article>

    <article class="col-sm-4 row justify-content-center mt-5">
        <h3>Sueldos</h3>
        <form action="" method="post" onsubmit="event.preventDefault();">
            <p>Elija su puesto</p>
            <select id="puesto" size="1" name="operador">
                <option value="0">Diseñador</option>
                <option value="1">Programador</option>
                <option value="2">Lider</option>
            </select>
            
            <p>Elija su nivel</p>
            <select id="nivel" size="1">
                <option value="0">Newbe</option>
                <option value="1">Jr</option>
                <option value="2">Sr</option>
            </select>
            
            <br><br>
            <label>Ingrese horas trabajadas</label>
            <input type="number" id="horas">
            
            <br><br>
            <button class="btn btn-outline-success" type="button" onclick="calcular()">Mostrar</button>
        </form>
        <article id="impSueldo" style="margin-top: 15px;"></article>
    </article>

    <article class="row justify-content-center mt-5">
            <h3>Dibujar Número 8</h3>
            <p>Haz clic en el botón para dibujar el número 8</p>
            <article>
            <button class="btn btn-outline-success" onclick="dibujarOcho()">Dibujar</button>
            <hr class="my-4">
            <article id="resultadoOcho" class="text-start"></article>
            </article>
    </article>

    <article class="row justify-content-center mt-5">
                <h3>Gestión de Alumnos</h3>
                <p>Captura, elimina rangos y busca posiciones</p>
                <article>
                <button class="btn btn-outline-success" onclick="gestionarAlumnos()">Iniciar Ejercicio</button>
                <hr class="my-4">
                <article id="resultadoAlumnos" class="text-start"></article>
                </article>
    </article>

    <article class="row justify-content-center mt-5 mb-5">
                <h3>Agenda</h3>
                <p>Haz clic en el botón para registrar tu agenda semanal</p>
                <article>
                <button class="btn btn-outline-success" onclick="agenda_definicion()">Iniciar Agenda</button>
                <hr class="my-4">
                <article id="impAgenda" class="text-start"></article>
                </article>
    </article>

    <footer class="container-fluid p-5 bg-info-subtle text-black text-center">Nadia Rodriguez</footer>
    <script src="js/arreglos.js"></script>      
</body>
</html>
