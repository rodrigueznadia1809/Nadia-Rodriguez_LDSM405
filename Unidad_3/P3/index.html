            <option value="4">Gramos a Miligramos</option>
            <option value="5">Miligramos a Kilogramos</option>
            <option value="6">Kilogramos a Miligramos</option>
        </select>
    <input type="button" id="btncalcular" class="btn-danger" value="Calcular" onclick="calcular();">
    </form>
 
</fieldset>
