    <title>Prácticas de Desarrollo Web</title>

    <style>

        body{
            background-color: #f6d6dc;
            font-family: Arial, sans-serif;
            margin: 0;
            color: #3b2430;
        }

        header{
            background-color: #6d214f;
            color: #fff4f6;
            text-align: center;
            padding: 35px;
            border-bottom: 6px solid #e58ba3;
        }

        header h1{
            font-family: Georgia, serif;
            font-size: 42px;
            margin: 10px;
        }

        header p{
            font-size: 18px;
        }

        section{
            background-color: #fff4f6;
            width: 80%;
            margin: 30px auto;
            padding: 25px;
            border: 3px solid #6d214f;
            box-shadow: 8px 8px 0px #b94b70;
        }

        section h1{
            color: #6d214f;
            font-family: Georgia, serif;
            font-size: 30px;
        }

        article{
            background-color: #f8cbd5;
            padding: 15px;
            border-left: 6px solid #b94b70;
        }

        article p{
            margin: 0;
            font-size: 17px;
        }

        a{
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #6d214f;
            color: white;
            text-decoration: none;
            border: 2px solid #3b2430;
            font-weight: bold;
        }

        a:hover{
            background-color: #b94b70;
        }

        footer{
            background-color: #3b2430;
            color: #fff4f6;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        footer h3{
            color: #f4a6b9;
            margin-bottom: 8px;
        }

        footer h5{
            margin-top: 0;
            font-weight: normal;
        }

    </style>
</head>
